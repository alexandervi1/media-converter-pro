<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' https: data:">
    <title>Media Converter Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app">
        <!-- Custom Title Bar -->
        <header class="titlebar">
            <div class="titlebar-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none" />
                </svg>
                <span>Media Converter Pro</span>
            </div>
            <div class="titlebar-controls">
                <button class="titlebar-btn" id="btn-minimize" title="Minimizar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
                <button class="titlebar-btn close" id="btn-close" title="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="6" y1="6" x2="18" y2="18" />
                        <line x1="6" y1="18" x2="18" y2="6" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab active" id="tab-home" data-tab="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span>Inicio</span>
            </button>
            <button class="tab" id="tab-search" data-tab="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <span>Buscar</span>
            </button>
            <button class="tab" id="tab-spotify" data-tab="spotify">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M8 15c2-1 5-1 8 1" />
                    <path d="M9 12c1.5-.8 4-.8 6 .5" />
                    <path d="M10 9c1.2-.5 3-.5 4 .3" />
                </svg>
                <span>Spotify</span>
            </button>
            <button class="tab" id="tab-downloads" data-tab="downloads">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>Descargas</span>
                <span class="tab-badge" id="downloads-badge"></span>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="content">
            <!-- HOME TAB -->
            <section class="panel active" id="panel-home">
                <div class="home-content">
                    <!-- Instruction -->
                    <p class="home-instruction">Pega un link de YouTube para comenzar</p>

                    <!-- URL Input -->
                    <div class="input-group">
                        <input type="text" class="url-input" id="url-input"
                            placeholder="https://youtube.com/watch?v=..." autocomplete="off" spellcheck="false">
                    </div>

                    <!-- Paste Button -->
                    <button class="btn-primary btn-large" id="btn-paste">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                        </svg>
                        <span>PEGAR LINK</span>
                    </button>

                    <!-- Loading State -->
                    <div class="loading-state hidden" id="loading-state">
                        <div class="spinner"></div>
                        <span>Obteniendo información...</span>
                    </div>

                    <!-- Video Preview -->
                    <div class="video-preview hidden" id="video-preview">
                        <img src="" alt="" class="preview-thumb" id="preview-thumb">
                        <div class="preview-info">
                            <p class="preview-title" id="preview-title">Título del video</p>
                            <p class="preview-channel" id="preview-channel">Canal</p>
                        </div>
                    </div>

                    <!-- Format Selector -->
                    <div class="format-selector hidden" id="format-selector">
                        <span class="format-label">Formato:</span>
                        <div class="format-buttons">
                            <button class="format-btn active" data-format="mp3" id="btn-format-mp3">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 18V5l12-2v13" />
                                    <circle cx="6" cy="18" r="3" />
                                    <circle cx="18" cy="16" r="3" />
                                </svg>
                                <span>MP3</span>
                            </button>
                            <button class="format-btn" data-format="mp4" id="btn-format-mp4">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18" />
                                    <line x1="7" y1="2" x2="7" y2="22" />
                                    <line x1="17" y1="2" x2="17" y2="22" />
                                    <line x1="2" y1="12" x2="22" y2="12" />
                                    <line x1="2" y1="7" x2="7" y2="7" />
                                    <line x1="2" y1="17" x2="7" y2="17" />
                                    <line x1="17" y1="17" x2="22" y2="17" />
                                    <line x1="17" y1="7" x2="22" y2="7" />
                                </svg>
                                <span>MP4</span>
                            </button>
                        </div>
                    </div>

                    <!-- Download Button -->
                    <button class="btn-success btn-mega hidden" id="btn-download">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        <span id="download-text">DESCARGAR MP3</span>
                    </button>

                    <!-- Folder Selector -->
                    <button class="folder-selector" id="folder-selector">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                        </svg>
                        <span id="folder-path">Seleccionar carpeta...</span>
                    </button>
                </div>
            </section>

            <!-- SEARCH TAB -->
            <section class="panel" id="panel-search">
                <div class="search-content">
                    <!-- Search Input -->
                    <div class="input-group">
                        <input type="text" class="url-input" id="search-input" placeholder="Buscar canción, artista..."
                            autocomplete="off" spellcheck="false">
                        <button class="btn-icon" id="btn-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.35-4.35" />
                            </svg>
                        </button>
                    </div>

                    <!-- Search Results -->
                    <div class="search-results" id="search-results">
                        <p class="empty-message">Busca canciones para descargar</p>
                    </div>
                </div>
            </section>

            <!-- SPOTIFY TAB -->
            <section class="panel" id="panel-spotify">
                <div class="spotify-content">
                    <!-- Spotify Input -->
                    <div class="input-group">
                        <input type="text" class="url-input" id="spotify-input"
                            placeholder="Pega link de playlist de Spotify..." autocomplete="off" spellcheck="false">
                    </div>

                    <!-- Load Playlist Button -->
                    <button class="btn-spotify btn-large" id="btn-load-playlist">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M8 15c2-1 5-1 8 1" />
                        </svg>
                        <span>CARGAR PLAYLIST</span>
                    </button>

                    <!-- Playlist Loading -->
                    <div class="loading-state hidden" id="spotify-loading">
                        <div class="spinner spotify"></div>
                        <span>Cargando playlist...</span>
                    </div>

                    <!-- Playlist Preview -->
                    <div class="playlist-preview hidden" id="playlist-preview">
                        <div class="playlist-header">
                            <img src="" alt="" class="playlist-cover" id="playlist-cover">
                            <div class="playlist-info">
                                <p class="playlist-name" id="playlist-name">Nombre de Playlist</p>
                                <p class="playlist-count" id="playlist-count">0 canciones</p>
                            </div>
                        </div>
                        <div class="track-list" id="track-list"></div>
                    </div>

                    <!-- Download All Button -->
                    <button class="btn-success btn-mega hidden" id="btn-download-playlist">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        <span id="download-playlist-text">DESCARGAR TODO</span>
                    </button>
                </div>
            </section>

            <!-- DOWNLOADS TAB -->
            <section class="panel" id="panel-downloads">
                <div class="downloads-content">
                    <!-- Header -->
                    <div class="downloads-header">
                        <h2>Descargas</h2>
                        <div class="downloads-actions">
                            <button class="btn-secondary" id="btn-open-folder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                                </svg>
                                <span>Abrir Carpeta</span>
                            </button>
                            <button class="btn-ghost" id="btn-clear" title="Limpiar historial">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6" />
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Downloads List -->
                    <div class="downloads-list" id="downloads-list">
                        <p class="empty-message" id="empty-downloads">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                            Las descargas aparecerán aquí
                        </p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast Notifications -->
        <div class="toast hidden" id="toast">
            <p class="toast-message" id="toast-message"></p>
        </div>
    </div>

    <script defer src="js/bundle.js"></script>
</body>

</html>
